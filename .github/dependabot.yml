version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates of the dev tools arrive as one PR. A major version
      # (ESLint, TypeScript) gets its own PR, because it usually needs code changes.
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The type definitions must match the oldest supported Node.js (engines: >=22),
      # so only updates inside the 22.x line are wanted.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
