name: CI

on:
  # Pull requests get their run from pull_request; push covers main itself, so a PR branch is not checked twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Unit tests with the coverage thresholds of package.json. The coverage
      # table is printed at the end of this step's log. Tests that need the
      # PlantUML runtime are reported as skipped here; the integration job runs them.
      - run: npm run test:coverage

  integration:
    name: Integration and gallery (PlantUML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The renderer (Temurin JRE, PlantUML, Inter) is pinned by version and
      # SHA-256 in scripts/setup-renderer.mjs, so that file is the cache key.
      - uses: actions/cache@v6
        with:
          path: .tools
          key: renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-renderer.mjs') }}
      - run: npm run setup:renderer
      - run: npm run test:integration
      - run: npm run gallery
